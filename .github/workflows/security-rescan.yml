# Weekly: rescan the images currently tagged "main" (the latest release) for
# vulnerabilities published since they were built. A finding fails this run
# (GitHub emails the repository's watchers); fix it by updating the base image
# or package and merging, which deploys a rebuilt image.
name: Weekly image rescan

on:
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Scan the live images
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thrill-rwanda"
          mkdir -p reports
          blocked=0
          echo "### Weekly rescan" >> "$GITHUB_STEP_SUMMARY"
          for kind in app tools; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD/reports:/reports" "$TRIVY_IMAGE" \
              image --quiet --scanners vuln --format json --output "/reports/$kind.json" "$repo-$kind:main"
            critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")] | length' "reports/$kind.json")
            high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" and (.FixedVersion // "") != "")] | length' "reports/$kind.json")
            echo "- **$kind**: $critical critical and $high high with a fix available" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and (.FixedVersion // "") != "") | "  \(.Severity) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)  \(.VulnerabilityID)"' "reports/$kind.json"
            [ "$critical" -eq 0 ] || blocked=1
          done
          [ "$blocked" = 0 ] || { echo "::error::The live release has critical vulnerabilities with fixes available."; exit 1; }
