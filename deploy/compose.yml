# Thrill Rwanda on one VPS: database, website, HTTPS and scheduled jobs.
#
# On the server this file lives in /opt/thrill and is run by deploy-gate
# (deploy/bin/deploy-gate) with the image tag in RELEASE. For a hand command, use
# the wrapper, which sets RELEASE to the running release:
#     /opt/thrill/bin/thrill ps
#     /opt/thrill/bin/thrill logs -f app
# To build locally instead of pulling, add compose.build.yml (see that file).
# Full steps: docs/VPS_DEPLOYMENT.md

name: thrill

x-database-url: &database-url "postgresql://thrill:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/thrill_rwanda"

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  init: true

x-images:
  app: &app-image ${IMAGE_REPO:-ghcr.io/alleluiacervi-tech/thrill-rwanda}-app:${RELEASE:?set RELEASE (the image tag) or use bin/thrill}
  tools: &tools-image ${IMAGE_REPO:-ghcr.io/alleluiacervi-tech/thrill-rwanda}-tools:${RELEASE:?set RELEASE (the image tag) or use bin/thrill}

services:
  db:
    # Pinned. Minor upgrades are deliberate: change the tag, deploy, check.
    image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: thrill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thrill_rwanda
    # Sized for a 4 GB server. Slow queries (over 1 s) are logged without values.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_parameter_max_length=0
    volumes:
      - db-data:/var/lib/postgresql/data
    # No published port: only the containers below can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thrill -d thrill_rwanda"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: 1280m
    stop_grace_period: 60s

  # Applies database migrations, then exits. deploy-gate runs it before each release.
  migrate:
    image: *tools-image
    <<: *hardened
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      DIRECT_URL: *database-url
    depends_on:
      db: { condition: service_healthy }
    command: ["prisma", "migrate", "deploy"]
    restart: "no"
    mem_limit: 768m

  app:
    image: *app-image
    <<: *hardened
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      DIRECT_URL: *database-url
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["3000"]
    volumes:
      # Optimised images survive deploys; bin/thrill-cleanup expires old ones.
      - next-cache:/app/.next/cache
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 1536m
    pids_limit: 512
    # Next finishes requests in flight on SIGTERM; give it time during a rollout.
    stop_grace_period: 30s

  # Runs the scheduled jobs and nightly encrypted backups (scripts/vps-scheduler.ts).
  scheduler:
    image: *tools-image
    <<: *hardened
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      DIRECT_URL: *database-url
      APP_INTERNAL_URL: http://app:3000
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./backups:/app/.backups
    tmpfs: ["/tmp:size=256m"]
    command: ["tsx", "scripts/vps-scheduler.ts"]
    mem_limit: 768m
    pids_limit: 256

  # Spreads requests over the running app containers, so a deploy can swap
  # them without a gap. It answers only on this server's loopback address:
  # the server's own Caddy (which also serves other sites) terminates HTTPS
  # for thrillrwanda.com and forwards here (deploy/host-caddy/).
  proxy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "127.0.0.1:${PROXY_PORT:-4100}:80"
    volumes:
      # The folder, not the file, so a new Caddyfile is seen by "caddy reload".
      - ./caddy:/etc/caddy:ro
      - proxy-data:/data
    mem_limit: 128m

# Permanent data. Thrill's cleanup never removes volumes, and the server's
# other weekly prune only removes unnamed ones. Never run "down -v" here.
volumes:
  db-data:
  proxy-data:
  next-cache:
